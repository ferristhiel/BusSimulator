<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>BusSimulator</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="BusSimulator 3D viewport"></canvas>
      <div id="hud" aria-live="polite"></div>
      <div id="help-panel">
        <strong>Steuerung</strong>
        <span>W/S oder ↑/↓: Gas/Bremse</span>
        <span>A/D oder ←/→: Lenken</span>
        <span>Leertaste: Parkbremse</span>
        <span>E: Haltestelle bedienen</span>
        <span>C: Kamera wechseln</span>
        <span>R: Route zurücksetzen</span>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
